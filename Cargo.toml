[package]
name = "remote-cli"
description = "Canonical cache, daemon, local Unix socket, remote SSE, authenticated snapshot, and smart-client substrate for Rust CLIs"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/harryaskham/remote-cli"
homepage = "https://github.com/harryaskham/remote-cli"
keywords = ["cli", "daemon", "sse", "cache", "unix-socket"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[lib]
name = "remote_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "6"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
